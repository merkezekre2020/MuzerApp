name: Build Unsigned IPA and Upload Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.0.0). If empty, uses current ref tag or run number."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    env:
      SCHEME: Muzer
      CONFIGURATION: Release
      ARCHIVE_PATH: ${{ github.workspace }}/build/Muzer.xcarchive
      EXPORT_DIR: ${{ github.workspace }}/build/export

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            echo "value=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=v0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Locate Xcode project/workspace
        id: project
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(find . -maxdepth 2 -name '*.xcworkspace' | head -n 1 || true)
          project=$(find . -maxdepth 2 -name '*.xcodeproj' | head -n 1 || true)

          if [[ -n "$workspace" ]]; then
            echo "type=workspace" >> "$GITHUB_OUTPUT"
            echo "path=$workspace" >> "$GITHUB_OUTPUT"
          elif [[ -n "$project" ]]; then
            echo "type=project" >> "$GITHUB_OUTPUT"
            echo "path=$project" >> "$GITHUB_OUTPUT"
          else
            echo "No .xcworkspace or .xcodeproj found. Please commit your Xcode project files."
            exit 1
          fi

      - name: Archive app (unsigned)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EXPORT_DIR"

          if [[ "${{ steps.project.outputs.type }}" == "workspace" ]]; then
            xcodebuild \
              -workspace "${{ steps.project.outputs.path }}" \
              -scheme "$SCHEME" \
              -configuration "$CONFIGURATION" \
              -destination 'generic/platform=iOS' \
              -archivePath "$ARCHIVE_PATH" \
              clean archive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          else
            xcodebuild \
              -project "${{ steps.project.outputs.path }}" \
              -scheme "$SCHEME" \
              -configuration "$CONFIGURATION" \
              -destination 'generic/platform=iOS' \
              -archivePath "$ARCHIVE_PATH" \
              clean archive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          fi

      - name: Create unsigned IPA from archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          app_path=$(find "$ARCHIVE_PATH/Products/Applications" -name '*.app' | head -n 1)
          if [[ -z "$app_path" ]]; then
            echo "No .app bundle found in archive."
            exit 1
          fi

          payload_dir="$EXPORT_DIR/Payload"
          mkdir -p "$payload_dir"
          cp -R "$app_path" "$payload_dir/"

          ipa_name="Muzer-${{ steps.tag.outputs.value }}-unsigned.ipa"
          (cd "$EXPORT_DIR" && /usr/bin/zip -qry "$ipa_name" Payload)

          echo "ipa_path=$EXPORT_DIR/$ipa_name" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muzer-unsigned-ipa
          path: ${{ steps.package.outputs.ipa_path }}

      - name: Create/Update GitHub Release and upload IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: Muzer ${{ steps.tag.outputs.value }}
          draft: false
          prerelease: false
          files: |
            ${{ steps.package.outputs.ipa_path }}
          body: |
            Unsigned Muzer IPA build generated by GitHub Actions.
            
            Notes:
            - This artifact is unsigned and intended for CI/review/distribution pipelines.
            - It cannot be installed directly on non-jailbroken iOS devices without a valid signing step.
